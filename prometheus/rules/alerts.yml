groups:
  - name: threat_intel_platform_alerts
    interval: 30s
    rules:
      # API High Error Rate
      - alert: HighErrorRate
        expr: rate(http_errors_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec over the last 5 minutes"

      # API High Latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value }}s over the last 5 minutes"

      # Service Down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been unreachable for more than 1 minute"

      # High Request Rate (potential abuse)
      - alert: HighRequestRate
        expr: rate(http_requests_total[1m]) > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate is {{ $value }}/sec (potential abuse or traffic spike)"

      # RabbitMQ Queue Growth
      - alert: RabbitMQQueueGrowth
        expr: rabbitmq_queue_messages > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog growing"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages"

      # Redis Memory Usage
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory is {{ $value | humanizePercentage }} used"

      # PostgreSQL Connection Pool Exhaustion
      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of max connections in use"

      # Exception Spike
      - alert: ExceptionSpike
        expr: rate(exceptions_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Exception spike detected"
          description: "Exception rate is {{ $value }}/sec over the last 5 minutes"