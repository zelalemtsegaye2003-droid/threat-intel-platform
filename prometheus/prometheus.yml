global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend API metrics
  - job_name: "threat-intel-platform"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Celery worker metrics (if celery-exporter is added later)
  - job_name: "celery"
    static_configs:
      - targets: ["celery-exporter:9808"]
    scrape_interval: 30s

  # Docker daemon metrics (optional)
  - job_name: "docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]
    metrics_path: "/metrics"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Add alertmanager endpoint when ready

rule_files:
  - "/etc/prometheus/rules/*.yml"