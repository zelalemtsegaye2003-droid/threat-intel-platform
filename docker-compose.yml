services:
  # ──────────────────────────────────────────────
  # Reverse Proxy — TLS termination, rate limiting
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: threat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_data:/etc/nginx/ssl
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: threat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: threat-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: threat-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: threat-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - loki_data:/loki
    depends_on:
      - loki
    restart: unless-stopped

  #  tempo:
  #    image: grafana/tempo:2.5.0
  #    container_name: threat-tempo
  #    ports:
  #      - "3200:3200"   # Tempo endpoint
  #      - "4317:4317"   # OTLP gRPC
  #      - "4318:4318"   # OTLP HTTP
  #    volumes:
  #      - tempo_data:/tmp/tempo
  #    command: ["-config.file=/etc/tempo.yaml"]
  #    restart: unless-stopped

  flower:
    image: mher/flower:2.0.1
    container_name: threat-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=amqp://admin:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672
      - CELERY_RESULT_BACKEND=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: threat-postgres
    environment:
      POSTGRES_DB: threatintel
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15
    container_name: threat-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-secure_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: threat-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC

  redis:
    image: redis:7.2-alpine
    container_name: threat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: threat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secure_password}
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threat-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      DB_SCHEMA_MANAGEMENT: ${DB_SCHEMA_MANAGEMENT:-migrations}
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-secure_password}@postgres:5432/threatintel
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-secure_password}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      USE_VERTEX_AI: ${USE_VERTEX_AI:-false}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      TLS_TERMINATED_UPSTREAM: ${TLS_TERMINATED_UPSTREAM:-false}
      TRUST_X_FORWARDED_FOR: ${TRUST_X_FORWARDED_FOR:-false}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-65}
      RUN_DB_MIGRATIONS_ON_START: ${RUN_DB_MIGRATIONS_ON_START:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
        - action: rebuild
          path: ./backend/Dockerfile

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery"]
    command:
      - "-A"
      - "app.workers.celery_app:celery_app"
      - "worker"
      - "--loglevel=INFO"
      - "--concurrency=2"
    container_name: threat-celery-worker
    environment:
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-secure_password}@postgres:5432/threatintel
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-secure_password}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery"]
    command:
      - "-A"
      - "app.workers.celery_app:celery_app"
      - "beat"
      - "--loglevel=INFO"
    container_name: threat-celery-beat
    environment:
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-secure_password}@postgres:5432/threatintel
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-secure_password}@rabbitmq:5672
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: threat-frontend
    environment:
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  redis_data:
  rabbitmq_data:
  ssl_data:
  certbot_www:

networks:
  default:
    name: threat-intel-network
